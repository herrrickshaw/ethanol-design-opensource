[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ethanol-design-opensource"
version = "0.1.0"
description = "Open-source conceptual sizing tools for a molasses/cane-juice fuel-ethanol distillery (feedstock, fermentation, distillation, molecular-sieve dehydration, stillage)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "CoolProp>=6.6",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ethanol_design*"]
